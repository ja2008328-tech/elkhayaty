<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختيار المادة | الجذع المشترك</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --math: #3498db; 
            --phys: #ff4757; 
            --bg: #0f172a; 
            --card: #1e293b; 
            --title: #2ecc71; 
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg); color: white; }

        /* شريط التنقل */
        nav { 
            background: rgba(30, 41, 59, 0.9); 
            padding: 15px 5%; 
            border-bottom: 1px solid rgba(255,255,255,0.05); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        
        .nav-logo { font-weight: 900; color: var(--title); font-size: 1.2rem; }

        /* زر العودة المطابق للصور (إطار رقيق ونص واضح) */
        .nav-link { 
            color: white; 
            text-decoration: none; 
            font-weight: 700; 
            font-size: 0.85rem; 
            padding: 5px 18px; 
            border-radius: 5px;
            border: 1px solid rgba(255, 255, 255, 0.4); /* إطار أبيض شفاف في البداية */
            transition: 0.3s ease-in-out;
            display: inline-block;
        }

        /* الحالة عند تمرير الماوس بشكل عام */
        .nav-link:hover {
            border-color: var(--title);
            color: var(--title);
        }

        .container { max-width: 900px; margin: 50px auto; padding: 0 20px; }
        .header-area { text-align: center; margin-bottom: 60px; }
        .header-area h1 { font-weight: 900; font-size: 2.2rem; line-height: 1.4; margin-bottom: 15px; }
        .title-phys { color: var(--phys); }
        .title-math { color: var(--math); }

        .subjects-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
        
        /* تأثير الانبثاق للبطاقات */
        .subject-card { 
            background: var(--card); 
            border-radius: 12px; 
            padding: 40px; 
            border: 1px solid rgba(255,255,255,0.05); 
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            text-align: center; 
        }

        /* تفاعل البطاقات وتأثيرها على الزر العلوي */
        .math-card:hover { transform: translateY(-10px); border-color: var(--math); box-shadow: 0 10px 30px rgba(52, 152, 219, 0.2); }
        .phys-card:hover { transform: translateY(-10px); border-color: var(--phys); box-shadow: 0 10px 30px rgba(255, 71, 87, 0.2); }

        .math-title { color: var(--math); font-weight: 900; font-size: 1.8rem; margin-bottom: 25px; }
        .phys-title { color: var(--phys); font-weight: 900; font-size: 1.8rem; margin-bottom: 25px; }

        .btn-semester {
            display: block; padding: 15px; margin: 12px 0; border-radius: 6px;
            text-decoration: none; color: white; font-weight: 700;
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05);
            transition: 0.3s;
        }
        
        .math-card .btn-semester:hover { background: var(--math); color: #0f172a; }
        .phys-card .btn-semester:hover { background: var(--phys); color: #0f172a; }

        footer { text-align: center; padding: 40px; color: #475569; font-size: 0.8rem; font-weight: 600; }
    </style>
</head>
<body>
    <nav>
        <div class="nav-logo">الجذع المشترك العلمي</div>
        <a href="index.html" class="nav-link">العودة</a>
    </nav>

    <div class="container">
        <div class="header-area">
            <h1><span class="title-phys">الفيزياء والكيمياء</span> و <span class="title-math">الرياضيات</span></h1>
        </div>

        <div class="subjects-grid">
            <div class="subject-card math-card">
                <h2 class="math-title">الرياضيات</h2>
                <a href="math-s1.html" class="btn-semester">الدورة الأولى</a>
                <a href="#" class="btn-semester">الدورة الثانية</a>
            </div>

            <div class="subject-card phys-card">
                <h2 class="phys-title">الفيزياء والكيمياء</h2>
                <a href="phys-s1.html" class="btn-semester">الدورة الأولى</a>
                <a href="#" class="btn-semester">الدورة الثانية</a>
            </div>
        </div>
    </div>
    <footer>جميع الحقوق محفوظة منصة العلوم &copy; 2026</footer>
</body>
</html>

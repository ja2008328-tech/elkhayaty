<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>حساب عبر الدورات | جذع مشترك علمي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --primary: #2ecc71; 
            --bg: #0f172a; 
            --card: #1e293b; 
            --text: #f8fafc; 
            color-scheme: dark;
        }

        /* --- أنيميشن التنقل (كما هي بدون تغيير) --- */
        @keyframes fadeInPage {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .page-transition {
            animation: fadeInPage 0.8s ease-out forwards;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Cairo', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            /* إضافة: تنعيم تجربة الهاتف */
            user-select: none;
            -webkit-user-select: none;
        }

        body { 
            background-color: var(--bg); 
            color: var(--text); 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column;
            padding-bottom: env(safe-area-inset-bottom); /* تحسين للهواتف الحديثة */
        }

        /* تحسين الحاوية لتكون مرنة */
        .container { 
            max-width: 1100px; 
            margin: 0 auto; 
            padding: 0 10px; 
            width: 100%; 
        }

        .top-nav {
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            background: var(--card); 
            padding: 12px 15px; /* تصغير قليلاً للهاتف */
            border-radius: 0 0 15px 15px;
            margin-bottom: 25px; 
            border-bottom: 2px solid var(--primary);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .btn-back {
            text-decoration: none; 
            color: var(--text); 
            padding: 6px 18px;
            border: 1px solid rgba(255,255,255,0.2); 
            border-radius: 8px; 
            font-weight: 700; 
            font-size: 0.8rem; /* تصغير طفيف للهاتف */
            transition: 0.3s;
        }

        .btn-back:hover { 
            background: var(--primary); 
            color: #0f172a; 
            border-color: var(--primary); 
        }

        .nav-title { 
            color: var(--primary); 
            font-weight: 900; 
            font-size: 0.95rem; /* قياس مثالي للهاتف */
        }

        .pro-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .pro-header h1 {
            font-size: clamp(1.6rem, 8vw, 2.2rem); /* تصغير آلي في الشاشات الصغيرة */
            font-weight: 900;
            background: linear-gradient(to left, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .pro-hint {
            color: #94a3b8;
            font-size: 0.85rem; /* تصغير طفيف لعدم كسر السطر */
            padding: 0 10px;
        }

        .semesters-grid {
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); /* جعل الكروت بجانب بعضها حتى في الهواتف المتوسطة */
            gap: 15px; 
            margin-bottom: 25px;
        }

        .semester-card {
            background: var(--card); 
            padding: 25px 15px; 
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.05); 
            text-align: center;
            transition: 0.3s;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .semester-card:focus-within { 
            border-color: var(--primary); 
            transform: translateY(-5px); 
        }
        
        .semester-card label { 
            display: block; 
            font-size: 1rem; /* قياس منضبط */
            font-weight: 900; 
            margin-bottom: 12px; 
            color: var(--primary); 
        }

        .semester-card input {
            width: 100%; 
            padding: 10px; 
            border-radius: 12px; 
            border: 2px solid rgba(255,255,255,0.1);
            background: var(--bg); 
            color: white; 
            text-align: center; 
            font-size: 1.5rem; /* قياس كبير وواضح */
            font-weight: 900; 
            outline: none; 
            transition: 0.3s;
            user-select: text; /* السماح بالكتابة فقط */
            -webkit-user-select: text;
        }

        /* --- الفوتر (تصغير القياسات للهاتف) --- */
        .footer-avg { 
            background: linear-gradient(135deg, var(--primary), #27ae60); 
            color: #0f172a;
            padding: 20px; 
            border-radius: 20px; 
            text-align: center;
            box-shadow: 0 10px 30px rgba(46, 204, 113, 0.2); 
            margin-top: auto;
            margin-bottom: 20px;
        }

        .result-title { 
            font-size: 1rem; 
            font-weight: 700; 
            margin-bottom: 5px; 
            opacity: 0.9; 
        }

        #finalResult { 
            font-size: clamp(2.5rem, 12vw, 4rem); /* تصغير المعدل ليناسب عرض الهاتف */
            font-weight: 900; 
            line-height: 1; 
            margin-bottom: 15px;
        }

        .footer-btns {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .btn-action {
            background: #0f172a; 
            color: white; 
            border: none;
            padding: 10px 20px; 
            border-radius: 10px; 
            cursor: pointer; 
            font-weight: 900;
            font-size: 0.85rem;
            display: inline-flex; 
            align-items: center; 
            gap: 8px; 
            transition: 0.3s;
        }

        .btn-clear { background: #e74c3c; }

        /* --- تحسينات الحاسوب (إعادة القياسات الكبيرة) --- */
        @media (min-width: 769px) {
            .container { padding: 0 20px; }
            .top-nav { padding: 15px 25px; margin-bottom: 40px; }
            .nav-title { font-size: 1.1rem; }
            .btn-back { font-size: 0.9rem; padding: 8px 24px; }
            .pro-header { margin-bottom: 40px; }
            .semesters-grid { gap: 25px; margin-bottom: 40px; }
            .semester-card { padding: 40px 30px; }
            .semester-card label { font-size: 1.3rem; }
            .semester-card input { font-size: 2rem; padding: 15px; }
            .footer-avg { padding: 35px; }
            .result-title { font-size: 1.2rem; }
            .btn-action { padding: 12px 30px; font-size: 1rem; }
        }

        @media (max-width: 480px) {
            .footer-btns { flex-direction: row; } /* جعل الأزرار بجانب بعضها لتقليل الطول */
            .btn-action { padding: 10px 15px; font-size: 0.75rem; flex: 1; justify-content: center; }
        }
    </style>
</head>
<body class="page-transition"> 
<div class="container">
    <nav class="top-nav">
        <a href="selection.html" class="btn-back"><i class="fas fa-arrow-right"></i> العودة</a>
        <div class="nav-title">معدلات الدورات</div>
    </nav>

    <header class="pro-header">
        <h1>حساب عبر الدورات</h1>
        <p class="pro-hint">يتم <strong>حفظ بياناتك تلقائياً</strong>. أدخل معدلاتك السنوية لمعرفة النتيجة النهائية.</p>
    </header>

    <div class="semesters-grid">
        <div class="semester-card">
            <label><i class="fas fa-graduation-cap"></i> الدورة الأولى</label>
            <input type="text" inputmode="decimal" id="s1" placeholder="00.00" oninput="validateAndCalc(this)">
        </div>
        <div class="semester-card">
            <label><i class="fas fa-award"></i> الدورة الثانية</label>
            <input type="text" inputmode="decimal" id="s2" placeholder="00.00" oninput="validateAndCalc(this)">
        </div>
    </div>

    <div class="footer-avg">
        <div class="result-title">المعدل العام السنوي</div>
        <div id="finalResult">0.00</div>
        
        <div class="footer-btns">
            <button class="btn-action btn-clear" onclick="clearData()">
                <i class="fas fa-trash-alt"></i> تصفير
            </button>
            <button class="btn-action" onclick="alert('يتم الحفظ تلقائياً عند الكتابة!')">
                <i class="fas fa-check-circle"></i> حفظ النتيجة
            </button>
        </div>
    </div>
</div>

<script>
    function validateAndCalc(input) {
        input.value = input.value.replace(/[^0-9.]/g, '');
        if ((input.value.match(/\./g) || []).length > 1) {
            input.value = input.value.replace(/\.+$/, "");
        }
        calc();
        saveData();
    }

    function calc() {
        let s1 = parseFloat(document.getElementById('s1').value) || 0;
        let s2 = parseFloat(document.getElementById('s2').value) || 0;
        let avg = (s1 + s2) > 0 ? (s1 + s2) / 2 : 0;
        document.getElementById('finalResult').innerText = avg.toFixed(2);
        localStorage.setItem('total_average', avg.toFixed(2));
    }

    function saveData() {
        const finalResultVal = document.getElementById('finalResult').innerText;
        const data = {
            s1: document.getElementById('s1').value,
            s2: document.getElementById('s2').value,
            result: finalResultVal
        };
        localStorage.setItem('massar_semesters_v2', JSON.stringify(data));
        localStorage.setItem('total_average', finalResultVal);
    }

    function loadSavedData() {
        const saved = localStorage.getItem('massar_semesters_v2');
        if (saved) {
            const data = JSON.parse(saved);
            document.getElementById('s1').value = data.s1 || "";
            document.getElementById('s2').value = data.s2 || "";
            calc();
        }
    }

    function clearData() {
        if(confirm("هل تريد مسح المعدلات المسجلة؟")) {
            localStorage.removeItem('massar_semesters_v2');
            localStorage.removeItem('total_average');
            location.reload();
        }
    }

    window.onload = loadSavedData;
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التقرير السنوي | منصة التميز</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #a855f7; 
            --s1-color: #3498db;
            --s2-color: #f1c40f;
            --total-color: #2ecc71;
            --bg: #0f172a; 
            --card: #1e293b; 
            --text: #f8fafc;
        }

        /* --- أنيميشن التنقل (Page Transition) --- */
        @keyframes fadeInPage {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* تطبيق الأنيميشن على حاوية الصفحة */
        .page-transition {
            animation: fadeInPage 0.8s ease-out forwards;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding-bottom: 50px; }

        nav { 
            background: var(--card); padding: 15px 5%; border-bottom: 2px solid var(--primary); 
            display: flex; justify-content: space-between; align-items: center; 
            position: sticky; top: 0; z-index: 1000; border-radius: 0 0 20px 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .nav-logo { font-weight: 900; color: var(--primary); font-size: 1.2rem; display: flex; align-items: center; gap: 10px; }
        .nav-link { color: white; text-decoration: none; font-weight: 700; padding: 6px 20px; border: 1.5px solid var(--primary); border-radius: 10px; transition: 0.3s; }
        .nav-link:hover { background: var(--primary); color: white; }

        .container { max-width: 900px; margin: 30px auto; padding: 0 15px; }

        .yearly-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .year-card {
            background: var(--card); padding: 25px; border-radius: 20px; text-align: center;
            border-bottom: 4px solid #ccc; transition: 0.3s; box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .year-card:hover { transform: translateY(-5px); }
        .year-card h2 { font-size: 0.9rem; color: #94a3b8; margin-bottom: 10px; font-weight: 700; }
        .year-card .grade { font-size: 2.8rem; font-weight: 900; display: block; line-height: 1; }
        .s1 { border-color: var(--s1-color); }
        .s2 { border-color: var(--s2-color); }
        .total { border-color: var(--total-color); background: linear-gradient(145deg, #1e293b, #0f172a); }

        .chart-card { background: var(--card); border-radius: 20px; padding: 30px; border: 1px solid rgba(255,255,255,0.05); }
        .bar-wrapper { margin-bottom: 22px; }
        .bar-label { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: 700; font-size: 0.95rem; }
        .bar-bg { background: #0b1120; height: 14px; border-radius: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,0.03); }
        .bar-fill { height: 100%; width: 0; border-radius: 10px; transition: width 2s cubic-bezier(0.17, 0.67, 0.83, 0.67); }

        .excel { background: linear-gradient(90deg, #a855f7, #ec4899); }
        .good { background: linear-gradient(90deg, #2ecc71, #10b981); }
        .warn { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
        .danger { background: linear-gradient(90deg, #ef4444, #b91c1c); }

        .summary-box {
            text-align: center; background: linear-gradient(145deg, #1e293b, #111827); 
            border: 1px solid rgba(168, 85, 247, 0.3); padding: 30px; border-radius: 24px; 
            margin-top: 40px; position: relative; overflow: hidden;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.1);
        }
        .summary-box::before { content: ""; position: absolute; top: 0; right: 0; width: 6px; height: 100%; background: var(--primary); }
        .summary-box h3 { color: var(--primary); margin-bottom: 15px; font-weight: 900; font-size: 1.4rem; display: flex; align-items: center; justify-content: center; gap: 15px; }
        .summary-box p { font-size: 1.1rem; line-height: 1.8; color: #cbd5e1; }

        footer { text-align: center; padding: 40px; color: #475569; font-size: 0.8rem; font-weight: 700; }
    </style>
</head>
<body class="page-transition"> <nav>
        <div class="nav-logo"><i class="fas fa-chart-line"></i> تقرير النجاح</div>
        <a href="index.html" class="nav-link">العودة للرئيسية</a>
    </nav>

    <div class="container">
        <div class="yearly-grid">
            <div class="year-card s1">
                <h2>معدل الدورة 1</h2>
                <span class="grade" id="s1-val" style="color: var(--s1-color);">--</span>
            </div>
            <div class="year-card s2">
                <h2>معدل الدورة 2</h2>
                <span class="grade" id="s2-val" style="color: var(--s2-color);">--</span>
            </div>
            <div class="year-card total">
                <h2>المعدل السنوي العام</h2>
                <span class="grade" id="total-val" style="color: var(--total-color);">--</span>
            </div>
        </div>

        <h3 style="margin-bottom: 25px; border-right: 5px solid var(--primary); padding-right: 15px; font-weight: 900; display: flex; align-items: center; gap: 15px;">
            <i class="fas fa-list-check"></i> تفاصيل جميع المواد
        </h3>

        <div id="materialsChart" class="chart-card"></div>

        <div id="adviceSection" class="summary-box" style="display: none;">
            <h3><i class="fas fa-magic"></i> تلميح المنصة</h3>
            <p id="adviceText"></p>
        </div>
    </div>

    <footer>جميع الحقوق محفوظة منصة التميز &copy; 2026</footer>

    <script>
        window.onload = function() {
            // كود الجافا سكربت الخاص بك لم يتغير أبداً
            const yearlyData = JSON.parse(localStorage.getItem('massar_semesters_v2') || "{}");
            const s1 = yearlyData.s1 || "--"; 
            const s2 = yearlyData.s2 || "--";
            const total = yearlyData.result || "--";

            document.getElementById('s1-val').innerText = s1;
            document.getElementById('s2-val').innerText = s2;
            document.getElementById('total-val').innerText = total;

            const detailedData = JSON.parse(localStorage.getItem('massar_detailed_v5') || "{}");
            const quickData = JSON.parse(localStorage.getItem('massar_subjects_v5') || "{}");
            
            const subjects = [
                {id: 0, name: "اللغة الفرنسية"}, {id: 1, name: "الرياضيات"},
                {id: 2, name: "الفيزياء والكيمياء"}, {id: 3, name: "المعلوميات"},
                {id: 4, name: "اللغة العربية"}, {id: 5, name: "اللغة الإنجليزية"},
                {id: 6, name: "علوم الحياة والأرض"}, {id: 7, name: "الاجتماعيات"},
                {id: 8, name: "التربية الإسلامية"}, {id: 9, name: "الفلسفة"},
                {id: 10, name: "التربية البدنية"}, {id: 11, name: "المواظبة والسلوك"}
            ];

            let html = "";
            let strong = [];
            let weak = [];

            subjects.forEach(sub => {
                let avg = 0;
                if (detailedData[`f1-${sub.id}`] || detailedData[`act-${sub.id}`]) {
                    let f1 = parseFloat(detailedData[`f1-${sub.id}`]) || 0;
                    let f2 = parseFloat(detailedData[`f2-${sub.id}`]) || 0;
                    let f3 = parseFloat(detailedData[`f3-${sub.id}`]) || 0;
                    let f4 = parseFloat(detailedData[`f4-${sub.id}`]) || 0;
                    let act = parseFloat(detailedData[`act-${sub.id}`]) || 0;
                    let exams = [f1, f2, f3, f4].filter(v => v > 0);
                    let examAvg = exams.length > 0 ? exams.reduce((a, b) => a + b) / exams.length : 0;
                    if (sub.name === "الرياضيات") avg = examAvg;
                    else if (sub.name === "المواظبة والسلوك") avg = act;
                    else avg = (examAvg * 0.75) + (act * 0.25);
                } else if (quickData[`grade-${sub.id}`]) {
                    avg = parseFloat(quickData[`grade-${sub.id}`]);
                }

                if(avg > 0) {
                    let colorClass = "danger";
                    if(avg >= 16) colorClass = "excel";
                    else if(avg >= 12) colorClass = "good";
                    else if(avg >= 10) colorClass = "warn";
                    if(avg >= 15) strong.push(sub.name);
                    if(avg < 10) weak.push(sub.name);

                    html += `
                        <div class="bar-wrapper">
                            <div class="bar-label"><span>${sub.name}</span><span>${avg.toFixed(2)}</span></div>
                            <div class="bar-bg">
                                <div class="bar-fill ${colorClass}" style="width: ${(avg/20)*100}%"></div>
                            </div>
                        </div>`;
                }
            });

            document.getElementById('materialsChart').innerHTML = html || "<p style='text-align:center; padding:30px;'>يرجى إدخال النقط في إحدى الحاسبات ليظهر التحليل.</p>";

            if(html) {
                document.getElementById('adviceSection').style.display = 'block';
                let msg = "";
                if (strong.length > 0) msg += `مستواك في <b>${strong.join(' و ')}</b> يثير الإعجاب! أنت تملك قدرات عالية في هذه المواد. `;
                if (weak.length > 0) msg += `<br><br>يجب الحذر من مادة <b>${weak.join(' و ')}</b>، حاول مراجعة نقاط الضعف فيها لرفع معدلك السنوي العام.`;
                else msg += "<br>نتائجك متوازنة جداً، استمر في العمل بجد لتحقيق أفضل معدل سنوي ممكن.";
                document.getElementById('adviceText').innerHTML = msg;
            }
        }
    </script>
</body>
</html>

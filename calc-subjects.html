<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <title>محاكي مسار | معدلات المواد</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --primary: #2ecc71; 
            --bg: #0f172a; 
            --card: rgba(30, 41, 59, 0.7); 
            --text: #f8fafc; 
            --danger: #ff4757;
            --warning: #ffa502;
            color-scheme: dark;
        }

        @keyframes fadeInPage {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* أنيميشن نبض خفيف للمعدل */
        @keyframes pulseScale {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .page-transition { animation: fadeInPage 0.8s ease-out forwards; }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Cairo', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body { 
            background-color: var(--bg); 
            background-image: radial-gradient(circle at top right, rgba(46, 204, 113, 0.05), transparent);
            color: var(--text); 
            padding-bottom: env(safe-area-inset-bottom);
            padding-top: env(safe-area-inset-top);
            line-height: 1.4;
            min-height: 100vh;
        }

        .container { 
            max-width: 900px; 
            margin: 0 auto; 
            padding: 0 8px; 
        }

        .top-nav {
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            background: rgba(15, 23, 42, 0.8); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 12px 15px; 
            border-radius: 0 0 15px 15px;
            margin-bottom: 15px; 
            border-bottom: 2px solid var(--primary);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .btn-back {
            text-decoration: none; 
            color: var(--text); 
            padding: 6px 14px; 
            border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 10px; 
            font-weight: 700; 
            font-size: 0.8rem; 
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(255,255,255,0.03);
        }

        .btn-back:hover { background: var(--primary); color: #0f172a; transform: translateX(-3px); }
        .btn-back:active { transform: scale(0.9); }

        .nav-title { color: var(--primary); font-weight: 900; font-size: 0.9rem; letter-spacing: 0.5px; }

        .pro-header { text-align: center; margin-bottom: 20px; }
        .pro-header h1 {
            font-size: clamp(1.6rem, 7vw, 2.5rem); 
            font-weight: 900;
            background: linear-gradient(135deg, #fff 30%, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: slideDown 0.8s ease-out;
        }

        .pro-hint {
            margin-top: 5px;
            padding: 8px 15px;
            background: rgba(46, 204, 113, 0.08);
            border-right: 4px solid var(--primary);
            color: #94a3b8;
            font-size: 0.75rem; 
            border-radius: 6px;
        }

        .table-container { 
            background: var(--card); 
            backdrop-filter: blur(10px);
            border-radius: 18px; 
            padding: 10px; 
            border: 1px solid rgba(255,255,255,0.08); 
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        table { width: 100%; border-collapse: collapse; }
        
        th { 
            background: rgba(46, 204, 113, 0.12); 
            color: var(--primary); 
            padding: 12px 5px; 
            font-size: 0.8rem;
            font-weight: 900;
            text-transform: uppercase;
        }

        td { padding: 10px 2px; border-bottom: 1px solid rgba(255,255,255,0.05); text-align: center; }
        
        .subject-name { 
            text-align: right; 
            font-weight: 700; 
            color: #f1f5f9;
            font-size: 0.8rem;
            padding-right: 8px;
        }
        
        input {
            width: 52px; 
            padding: 8px; 
            border-radius: 10px; 
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(15, 23, 42, 0.6); 
            color: white; 
            text-align: center; 
            font-weight: 700; 
            font-size: 0.9rem;
            outline: none; 
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input:focus { 
            border-color: var(--primary); 
            transform: scale(1.15); 
            box-shadow: 0 0 15px rgba(46, 204, 113, 0.3);
            background: var(--bg);
            z-index: 10;
        }
        
        .coef-input { color: var(--primary); font-weight: 900; }

        .footer-avg { 
            margin: 20px 0 30px 0; 
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(15px);
            padding: 15px 20px; 
            border-radius: 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border: 1px solid rgba(46, 204, 113, 0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        #grandTotal { 
            font-size: 2.5rem; 
            font-weight: 900; 
            transition: color 0.5s ease;
            display: block;
        }

        /* ألوان مؤشرات الأداء */
        .status-low { color: var(--danger) !important; }
        .status-mid { color: var(--warning) !important; }
        .status-high { color: var(--primary) !important; text-shadow: 0 0 10px rgba(46, 204, 113, 0.4); }

        .total-label { font-weight: 900; font-size: 0.9rem; color: #94a3b8; }

        .footer-btns { display: flex; gap: 10px; }

        .btn-footer { 
            background: #1e293b; 
            color: white; 
            border: 1px solid rgba(255,255,255,0.1); 
            padding: 12px 18px; 
            border-radius: 12px; 
            font-weight: 900; 
            font-size: 0.8rem;
            display: flex; 
            align-items: center; 
            gap: 8px;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-footer:hover { transform: translateY(-4px); background: #334155; }
        .btn-footer:active { transform: scale(0.9); }
        .btn-clear { background: rgba(231, 76, 60, 0.1); color: #e74c3c; border-color: rgba(231, 76, 60, 0.2); }
        .btn-clear:hover { background: #e74c3c; color: white; }

        @media (min-width: 769px) {
            input { width: 80px; }
            .subject-name { font-size: 1rem; }
            #grandTotal { font-size: 3.5rem; }
        }
    </style>
</head>
<body class="page-transition"> 
<div class="container">
    <nav class="top-nav">
        <a href="selection.html" class="btn-back"><i class="fas fa-arrow-right"></i> العودة</a>
        <div class="nav-title">معدلات المواد</div>
    </nav>

    <header class="pro-header">
        <h1>معدلات المواد</h1>
        <div class="pro-hint">
            <i class="fas fa-magic"></i> أدخل النقاط واضغط <strong>Enter</strong> للتالي.
        </div>
    </header>
    
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="text-align: right;">المادة</th>
                    <th>المعامل</th>
                    <th>المعدل</th>
                </tr>
            </thead>
            <tbody id="subjectsBody"></tbody>
        </table>
    </div>

    <div class="footer-avg">
        <div>
            <span class="total-label">المعدل العام المتوقع:</span>
            <div id="grandTotal">0.00</div>
        </div>
        <div class="footer-btns">
            <button class="btn-footer btn-clear" onclick="clearData()">
                <i class="fas fa-trash-alt"></i> <span>مسح</span>
            </button>
            <button class="btn-footer" onclick="saveVisualFeedback(this)">
                <i class="fas fa-check-circle"></i> <span>حفظ</span>
            </button>
        </div>
    </div>
</div>

<script>
    const subjects = [
        { name: "الرياضيات", coef: 4 },
        { name: "الفيزياء والكيمياء", coef: 4 },
        { name: "علوم الحياة والأرض", coef: 4 },
        { name: "اللغة الفرنسية", coef: 3 },
        { name: "اللغة العربية", coef: 2 },
        { name: "اللغة الإنجليزية", coef: 3 },
        { name: "الاجتماعيات", coef: 2 },
        { name: "التربية الإسلامية", coef: 2 },
        { name: "الفلسفة", coef: 2 },
        { name: "المعلوميات", coef: 2 },
        { name: "التربية البدنية", coef: 2 },
        { name: "المواظبة والسلوك", coef: 1 }
    ];

    function initTable() {
        const body = document.getElementById('subjectsBody');
        subjects.forEach((sub, index) => {
            body.innerHTML += `
                <tr>
                    <td class="subject-name">${sub.name}</td>
                    <td><input type="text" inputmode="decimal" id="coef-${index}" class="coef-input" value="${sub.coef}" oninput="validateAndCalc(this)" onkeydown="handleEnter(event, ${index}, 'coef')"></td>
                    <td><input type="text" inputmode="decimal" id="grade-${index}" class="grade-input" placeholder="-" oninput="validateAndCalc(this)" onkeydown="handleEnter(event, ${index}, 'grade')"></td>
                </tr>
            `;
        });
        loadSavedData();
    }

    // تحسين UX: الانتقال التلقائي بين الخانات
    function handleEnter(e, index, type) {
        if (e.key === "Enter") {
            e.preventDefault();
            let nextId = type === 'coef' ? `grade-${index}` : `coef-${index + 1}`;
            let nextInput = document.getElementById(nextId);
            if (nextInput) nextInput.focus();
        }
    }

    function validateAndCalc(input) {
        input.value = input.value.replace(/[^0-9.]/g, '');
        if ((input.value.match(/\./g) || []).length > 1) {
            input.value = input.value.replace(/\.+$/, "");
        }
        calcAll();
        saveCurrentProgress();
    }

    function calcAll() {
        let totalPoints = 0, totalCoef = 0;
        subjects.forEach((sub, index) => {
            let grade = parseFloat(document.getElementById(`grade-${index}`).value);
            let coef = parseFloat(document.getElementById(`coef-${index}`).value) || 0;
            if (!isNaN(grade)) {
                totalPoints += (grade * coef);
                totalCoef += coef;
            } else if (coef > 0) {
                totalCoef += coef; 
            }
        });
        
        let final = totalCoef > 0 ? (totalPoints / totalCoef).toFixed(2) : "0.00";
        const display = document.getElementById('grandTotal');
        display.innerText = final;

        // تحديث لون مؤشر الأداء
        display.classList.remove('status-low', 'status-mid', 'status-high');
        let numFinal = parseFloat(final);
        if (numFinal > 0 && numFinal < 10) display.classList.add('status-low');
        else if (numFinal >= 10 && numFinal < 15) display.classList.add('status-mid');
        else if (numFinal >= 15) display.classList.add('status-high');
    }

    function saveVisualFeedback(btn) {
        const icon = btn.querySelector('i');
        const originalClass = icon.className;
        icon.className = "fas fa-spinner fa-spin";
        setTimeout(() => {
            icon.className = "fas fa-check-double";
            btn.style.borderColor = "var(--primary)";
            setTimeout(() => {
                icon.className = originalClass;
                btn.style.borderColor = "rgba(255,255,255,0.1)";
            }, 1500);
        }, 500);
    }

    function saveCurrentProgress() {
        const data = {};
        subjects.forEach((_, index) => {
            data[`grade-${index}`] = document.getElementById(`grade-${index}`).value;
            data[`coef-${index}`] = document.getElementById(`coef-${index}`).value;
        });
        localStorage.setItem('massar_subjects_v5', JSON.stringify(data));
    }

    function loadSavedData() {
        const saved = localStorage.getItem('massar_subjects_v5');
        if (saved) {
            const data = JSON.parse(saved);
            subjects.forEach((_, index) => {
                if(data[`grade-${index}`]) document.getElementById(`grade-${index}`).value = data[`grade-${index}`];
                if(data[`coef-${index}`]) document.getElementById(`coef-${index}`).value = data[`coef-${index}`];
            });
            calcAll();
        }
    }

    function clearData() {
        if(confirm("هل تريد تصفير جميع النقاط؟")) {
            localStorage.removeItem('massar_subjects_v5');
            location.reload();
        }
    }

    window.onload = initTable;
</script>
</body>
</html>

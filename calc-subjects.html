<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكي مسار | معدلات المواد</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* --- الأساسيات: لضمان التوافق مع كل الشاشات --- */
        :root { 
            --primary: #2ecc71; 
            --bg: #0f172a; 
            --card: #1e293b; 
            --text: #f8fafc; 
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Cairo', sans-serif; 
        }

        body { 
            background-color: var(--bg); 
            color: var(--text); 
            padding-bottom: 50px; 
            line-height: 1.6;
        }

        /* الحاوية: عريضة في الحاسوب (1100px) ومرنة في الهاتف */
        .container { 
            max-width: 1100px; 
            margin: 0 auto; 
            padding: 0 15px; 
        }

        /* --- الشريط العلوي: متناسق تماماً --- */
        .top-nav {
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            background: var(--card); 
            padding: 15px 25px; 
            border-radius: 0 0 15px 15px;
            margin-bottom: 30px; 
            border-bottom: 2px solid var(--primary);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .btn-back {
            text-decoration: none; 
            color: var(--text); 
            padding: 8px 24px;
            border: 1px solid rgba(255,255,255,0.2); 
            border-radius: 8px; 
            font-weight: 700; 
            font-size: 0.9rem;
            transition: 0.3s ease;
        }

        .btn-back:hover { 
            background: var(--primary); 
            color: #0f172a; 
            border-color: var(--primary); 
        }

        .nav-title { 
            color: var(--primary); 
            font-weight: 900; 
            font-size: 1.1rem;
        }

        /* --- الهيدر --- */
        .pro-header {
            text-align: center;
            margin-bottom: 35px;
            padding: 0 10px;
        }

        .pro-header h1 {
            font-size: 2.2rem;
            font-weight: 900;
            background: linear-gradient(to left, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
        }

        .pro-hint {
            max-width: 750px;
            margin: 0 auto;
            padding: 15px 20px;
            background: rgba(46, 204, 113, 0.05);
            border-right: 4px solid var(--primary);
            color: #94a3b8;
            font-size: 0.9rem;
            border-radius: 4px;
            text-align: justify;
        }

        /* --- الجدول: يدعم السحب في الهاتف --- */
        .table-container { 
            overflow-x: auto; 
            background: var(--card); 
            border-radius: 15px; 
            padding: 10px; 
            border: 1px solid rgba(255,255,255,0.05); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            min-width: 500px; /* يمنع الجدول من الانضغاط الزائد في الهاتف */
        }
        
        th { 
            background: rgba(46, 204, 113, 0.08); 
            color: var(--primary); 
            padding: 15px; 
            font-size: 0.9rem; 
        }

        td { 
            padding: 12px 10px; 
            border-bottom: 1px solid rgba(255,255,255,0.05); 
            text-align: center; 
        }
        
        .subject-name { 
            text-align: right; 
            font-weight: 700; 
            color: #e2e8f0;
        }
        
        /* الخانات الموحدة: بدون أسهم، حفظ تلقائي، وتصميم نظيف */
        input {
            width: 80px;
            padding: 10px; 
            border-radius: 8px; 
            border: 1px solid rgba(255,255,255,0.1);
            background: var(--bg); 
            color: white; 
            text-align: center; 
            font-weight: 700; 
            outline: none; 
            transition: 0.3s ease;
        }

        /* منع الأسهم في كل المتصفحات */
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

        input:focus { 
            border-color: var(--primary); 
            box-shadow: 0 0 8px rgba(46, 204, 113, 0.3); 
            background: #162033;
        }

        .coef-input { color: var(--primary); border-color: rgba(46, 204, 113, 0.1); }

        /* --- الفوتر (النتيجة والأزرار) --- */
        .footer-avg { 
            margin-top: 30px; 
            background: linear-gradient(135deg, var(--primary), #27ae60); 
            color: #0f172a; 
            padding: 25px; 
            border-radius: 15px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 10px 20px rgba(46, 204, 113, 0.2);
        }

        #grandTotal { font-size: 3rem; font-weight: 900; }
        .total-label { font-weight: 700; font-size: 1.1rem; }

        .footer-btns { display: flex; gap: 12px; }

        .btn-footer { 
            background: #0f172a; 
            color: white; 
            border: none; 
            padding: 12px 28px; 
            border-radius: 10px; 
            cursor: pointer; 
            font-weight: 900; 
            display: flex; 
            align-items: center; 
            gap: 10px;
            transition: 0.3s ease;
        }

        .btn-clear { background: #e74c3c; }
        .btn-footer:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }

        /* --- تعديلات الهاتف الذكي (Mobile Responsive) --- */
        @media (max-width: 768px) {
            .top-nav { padding: 12px 15px; }
            .pro-header h1 { font-size: 1.7rem; }
            .footer-avg { 
                flex-direction: column; 
                text-align: center; 
                gap: 25px; 
            }
            .footer-btns { 
                flex-direction: column; 
                width: 100%; 
            }
            .btn-footer { 
                justify-content: center; 
                width: 100%; 
            }
            input { width: 70px; }
        }
    </style>
</head>
<body>

<div class="container">
    <nav class="top-nav">
        <a href="selection.html" class="btn-back"><i class="fas fa-arrow-right"></i> العودة</a>
        <div class="nav-title">معدلات المواد</div>
    </nav>

    <header class="pro-header">
        <h1>معدلات المواد</h1>
        <div class="pro-hint">
            <i class="fas fa-info-circle" style="margin-left: 8px;"></i> 
            أدخل المعدل النهائي لكل مادة ومعاملها. يتم <strong>حفظ بياناتك تلقائياً</strong> لتعود إليها في أي وقت.
        </div>
    </header>
    
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="text-align: right;">المادة</th>
                    <th>المعامل</th>
                    <th>معدل المادة</th>
                </tr>
            </thead>
            <tbody id="subjectsBody"></tbody>
        </table>
    </div>

    <div class="footer-avg">
        <div>
            <span class="total-label">المعدل العام المتوقع:</span>
            <div id="grandTotal">0.00</div>
        </div>
        <div class="footer-btns">
            <button class="btn-footer btn-clear" onclick="clearData()">
                <i class="fas fa-trash-alt"></i> تصفير
            </button>
            <button class="btn-footer" onclick="alert('تم الحفظ التلقائي بنجاح!')">
                <i class="fas fa-save"></i> حفظ النتيجة
            </button>
        </div>
    </div>
</div>

<script>
    // قائمة المواد
    const subjects = [
        { name: "الرياضيات", coef: 4 },
        { name: "الفيزياء والكيمياء", coef: 4 },
        { name: "علوم الحياة والأرض", coef: 4 },
        { name: "اللغة الفرنسية", coef: 3 },
        { name: "اللغة العربية", coef: 2 },
        { name: "اللغة الإنجليزية", coef: 3 },
        { name: "الاجتماعيات", coef: 2 },
        { name: "التربية الإسلامية", coef: 2 },
        { name: "الفلسفة", coef: 2 },
        { name: "المعلوميات", coef: 2 },
        { name: "التربية البدنية", coef: 2 },
        { name: "المواظبة والسلوك", coef: 1 }
    ];

    // بناء الجدول عند تحميل الصفحة
    function initTable() {
        const body = document.getElementById('subjectsBody');
        subjects.forEach((sub, index) => {
            body.innerHTML += `
                <tr>
                    <td class="subject-name">${sub.name}</td>
                    <td>
                        <input type="text" inputmode="decimal" id="coef-${index}" class="coef-input" value="${sub.coef}" oninput="validateAndCalc(this)">
                    </td>
                    <td>
                        <input type="text" inputmode="decimal" id="grade-${index}" class="grade-input" placeholder="-" oninput="validateAndCalc(this)">
                    </td>
                </tr>
            `;
        });
        loadSavedData();
    }

    // التحقق من المدخلات (أرقام فقط) والحساب التلقائي
    function validateAndCalc(input) {
        input.value = input.value.replace(/[^0-9.]/g, '');
        if ((input.value.match(/\./g) || []).length > 1) {
            input.value = input.value.replace(/\.+$/, "");
        }
        calcAll();
        saveCurrentProgress();
    }

    // حساب المعدل العام
    function calcAll() {
        let totalPoints = 0;
        let totalCoef = 0;

        subjects.forEach((sub, index) => {
            let grade = parseFloat(document.getElementById(`grade-${index}`).value);
            let coef = parseFloat(document.getElementById(`coef-${index}`).value) || 0;

            if (!isNaN(grade)) {
                totalPoints += (grade * coef);
                totalCoef += coef;
            } else if (coef > 0) {
                totalCoef += coef; 
            }
        });

        let final = totalCoef > 0 ? (totalPoints / totalCoef).toFixed(2) : "0.00";
        document.getElementById('grandTotal').innerText = final;
    }

    // حفظ البيانات في ذاكرة المتصفح
    function saveCurrentProgress() {
        const data = {};
        subjects.forEach((_, index) => {
            data[`grade-${index}`] = document.getElementById(`grade-${index}`).value;
            data[`coef-${index}`] = document.getElementById(`coef-${index}`).value;
        });
        localStorage.setItem('massar_subjects_v5', JSON.stringify(data));
    }

    // تحميل البيانات المحفوظة
    function loadSavedData() {
        const saved = localStorage.getItem('massar_subjects_v5');
        if (saved) {
            const data = JSON.parse(saved);
            subjects.forEach((_, index) => {
                if(data[`grade-${index}`]) document.getElementById(`grade-${index}`).value = data[`grade-${index}`];
                if(data[`coef-${index}`]) document.getElementById(`coef-${index}`).value = data[`coef-${index}`];
            });
            calcAll();
        }
    }

    // تصفير الجدول
    function clearData() {
        if(confirm("هل أنت متأكد من مسح جميع البيانات؟")) {
            localStorage.removeItem('massar_subjects_v5');
            location.reload();
        }
    }

    window.onload = initTable;
</script>
</body>
</html>

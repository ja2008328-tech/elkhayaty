<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة التميز | الأولى إعدادي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #2ecc71; --accent: #f1c40f; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding-bottom: 50px; }

        /* نافذة النتيجة الفخمة */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px);
            display: none; justify-content: center; align-items: center; z-index: 10000;
        }
        .modal-content {
            background: var(--card); padding: 40px; border-radius: 30px; border: 2px solid var(--primary);
            text-align: center; width: 90%; max-width: 400px; transform: scale(0.8); transition: 0.3s;
        }
        .modal.show { display: flex; }
        .modal.show .modal-content { transform: scale(1); }
        .score-circle {
            width: 150px; height: 150px; border-radius: 50%; border: 8px solid var(--primary);
            margin: 20px auto; display: flex; align-items: center; justify-content: center;
            font-size: 3rem; font-weight: 900; color: var(--primary);
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.2);
        }

        /* الجدول */
        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        .table-card { background: var(--card); border-radius: 20px; overflow-x: auto; border: 1px solid rgba(255,255,255,0.05); }
        table { width: 100%; border-collapse: collapse; min-width: 900px; }
        th { padding: 18px; color: var(--accent); font-size: 0.9rem; border-bottom: 2px solid rgba(255,255,255,0.1); }
        td { padding: 12px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .sub-name { text-align: right; font-weight: 700; color: #cbd5e1; padding-right: 25px; }

        input {
            width: 60px; padding: 10px; border-radius: 10px; border: 1px solid #475569;
            background: #0f172a; color: white; text-align: center; font-weight: bold;
        }
        .disabled { background: rgba(255,255,255,0.02); border: none; opacity: 0.1; cursor: not-allowed; }
        .calc-btn {
            display: block; margin: 30px auto; padding: 15px 50px; background: var(--primary);
            color: #0f172a; border: none; border-radius: 50px; font-weight: 900; cursor: pointer;
        }
    </style>
</head>
<body>

<div class="modal" id="scoreModal">
    <div class="modal-content">
        <h2 style="color: var(--accent);">نتيجتك النهائية</h2>
        <div class="score-circle" id="finalVal">0.00</div>
        <p id="gradeText" style="font-weight: 700; margin-bottom: 20px;"></p>
        <button onclick="closeModal()" style="background:none; border: 1px solid #475569; color: white; padding: 8px 20px; border-radius: 10px; cursor: pointer;">إغلاق</button>
    </div>
</div>

<div class="container">
    <h1 style="text-align: center; margin-bottom: 30px; color: var(--primary);">حساب معدل الأولى إعدادي</h1>
    <div class="table-card">
        <table>
            <thead>
                <tr>
                    <th style="width: 20%;">المادة</th>
                    <th>الفرض 1</th>
                    <th>الفرض 2</th>
                    <th>الفرض 3</th>
                    <th>الفرض 4</th>
                    <th>الأنشطة</th>
                    <th>المعامل</th>
                </tr>
            </thead>
            <tbody id="subjectsTable"></tbody>
        </table>
    </div>
    <button class="calc-btn" onclick="calculate()">إظهار النتيجة</button>
</div>

<script>
    // توزيع الفروض بناءً على الصور التي أرفقتها بدقة (الأولى إعدادي)
    const subjects = [
        { name: "الاجتماعيات", f: [1,2,4], act: false, c: 2 },
        { name: "التربية الإسلامية", f: [1,2,4], act: false, c: 2 },
        { name: "التربية البدنية", f: [1,2,3], act: false, c: 1 },
        { name: "الرياضيات", f: [1,2,3], act: false, c: 5 },
        { name: "الفيزياء والكيمياء", f: [1,2,4], act: false, c: 2 },
        { name: "اللغة الإنجليزية", f: [1,2,4], act: false, c: 2 },
        { name: "اللغة العربية", f: [1,2,4], act: false, c: 5 },
        { name: "اللغة الفرنسية", f: [1,2,3,4], act: true, c: 5 },
        { name: "علوم الحياة والأرض", f: [1,2,4], act: false, c: 2 },
        { name: "المعلوميات", f: [1,2,4], act: false, c: 1 }
    ];

    function initTable() {
        const tbody = document.getElementById('subjectsTable');
        subjects.forEach(sub => {
            let row = `<tr><td class="sub-name">${sub.name}</td>`;
            for(let i=1; i<=4; i++) {
                row += `<td><input type="number" class="f${i}" ${sub.f.includes(i) ? '' : 'disabled class="disabled"'}></td>`;
            }
            row += `<td>${sub.act ? '<input type="number" class="act">' : '<input disabled class="disabled">'}</td>`;
            row += `<td><input type="number" class="coeff" value="${sub.c}"></td></tr>`;
            tbody.innerHTML += row;
        });
    }

    function calculate() {
        let totalW = 0, totalC = 0;
        document.querySelectorAll('#subjectsTable tr').forEach(row => {
            const coeff = parseFloat(row.querySelector('.coeff').value) || 0;
            let sumF = 0, countF = 0;
            row.querySelectorAll('input:not(.coeff):not(.act):not(:disabled)').forEach(i => {
                if(i.value !== "") { sumF += parseFloat(i.value); countF++; }
            });
            const actVal = row.querySelector('.act')?.value;
            let subAvg = countF > 0 ? (sumF/countF) : 0;
            if(actVal && actVal !== "") subAvg = (subAvg + parseFloat(actVal)) / 2;
            
            if(countF > 0 || (actVal && actVal !== "")) {
                totalW += (subAvg * coeff);
                totalC += coeff;
            }
        });
        const final = totalC > 0 ? (totalW / totalC).toFixed(2) : "0.00";
        document.getElementById('finalVal').innerText = final;
        document.getElementById('gradeText').innerText = final >= 10 ? "مبروك، لقد نجحت! 🎉" : "حظ أوفر في المرة القادمة.";
        document.getElementById('scoreModal').classList.add('show');
    }

    function closeModal() { document.getElementById('scoreModal').classList.remove('show'); }
    window.onload = initTable;
</script>
</body>
</html>

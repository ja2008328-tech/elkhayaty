<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>تحليل الهدف | منصة التميز</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #f1c40f; 
            --gold: #f1c40f; 
            --success: #2ecc71;
            --bg: #0f172a; 
            --card: #1e293b; 
            --text: #f8fafc;
            --space-lg: clamp(20px, 5vw, 40px);
            --radius-main: 25px;
        }

        /* --- تحسينات النظام --- */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        
        html, body {
            max-width: 100%;
            overflow-x: hidden;
            background-color: var(--bg);
            scroll-behavior: smooth;
        }

        @keyframes fadeInPage {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- [إضافة] أنيميشن تحريك الأيقونة (الكأس/الصاروخ) --- */
        @keyframes floatIcon {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        body { 
            color: var(--text); 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            animation: fadeInPage 0.8s ease-out;
            padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
            background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%);
        }

        /* --- الشريط العلوي (Nav) --- */
        nav { 
            background: var(--card); 
            padding: 12px 6%; 
            border-bottom: 2px solid var(--primary); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            border-radius: 0 0 20px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }

        .nav-logo { font-weight: 900; color: var(--primary); font-size: 1.2rem; display: flex; align-items: center; gap: 10px; }
        
        .nav-link { 
            color: white; 
            text-decoration: none; 
            font-weight: 700; 
            padding: 8px 20px; 
            border: 1.5px solid var(--primary); 
            border-radius: 12px; 
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-link:hover { background: var(--primary); color: #000; }
        .nav-link:active { transform: scale(0.95); }

        /* --- المحتوى الرئيسي --- */
        .main-wrapper {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: var(--space-lg) 15px;
        }

        .target-card { 
            background: var(--card); 
            width: 100%; 
            max-width: 400px; 
            padding: var(--space-lg); 
            border-radius: var(--radius-main); 
            text-align: center; 
            border-bottom: 5px solid var(--primary); 
            box-shadow: 0 20px 40px rgba(0,0,0,0.4); 
            animation: slideUp 0.6s ease-out; 
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
            overflow: hidden;
        }

        @keyframes slideUp { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        
        .main-icon { 
            font-size: 3.5rem; 
            color: var(--gold); 
            margin-bottom: 15px;
            filter: drop-shadow(0 5px 15px rgba(241, 196, 15, 0.3));
            /* ربط حركة الطفو هنا */
            display: inline-block;
            animation: floatIcon 3s ease-in-out infinite;
        }

        h1 { font-size: 1.4rem; font-weight: 800; margin-bottom: 25px; }

        .stats-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 15px; 
            margin-bottom: 20px; 
        }
        
        .stat-box { 
            background: rgba(255,255,255,0.03); 
            padding: 20px 10px; 
            border-radius: 18px; 
            border: 1px solid rgba(255,255,255,0.05);
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .stat-box:active { transform: scale(0.95); background: rgba(255,255,255,0.08); }

        .stat-box i { font-size: 1.2rem; color: var(--primary); margin-bottom: 8px; display: block; }
        .stat-box label { display: block; font-size: 0.75rem; color: #94a3b8; font-weight: 700; margin-bottom: 5px; }
        .stat-box span { font-size: 1.5rem; font-weight: 900; color: #fff; font-family: sans-serif; }

        .progress-container {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            margin-bottom: 25px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--gold), #fff);
            box-shadow: 0 0 10px var(--gold);
            transition: width 1.5s cubic-bezier(0.1, 0.5, 0.2, 1);
        }

        .result-zone { 
            background: linear-gradient(145deg, #1e293b, #0f172a); 
            padding: 30px 15px; 
            border-radius: 22px; 
            margin-bottom: 25px; 
            border: 1px solid rgba(241, 196, 15, 0.15); 
        }
        
        .result-zone label { color: #94a3b8; font-weight: 700; font-size: 0.95rem; }
        .diff-number { font-size: 3.5rem; font-weight: 900; color: var(--gold); display: block; margin: 5px 0; letter-spacing: -2px; font-family: sans-serif; }
        .motivate-txt { font-weight: 700; color: var(--success); font-size: 0.95rem; }

        .btn-edit { 
            width: 100%;
            padding: 18px; 
            border-radius: 16px; 
            background: transparent; 
            color: var(--primary); 
            border: 2px solid var(--primary);
            font-weight: 800; 
            cursor: pointer; 
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            font-size: 1rem; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
        }

        .btn-edit:hover { background: rgba(241, 196, 15, 0.1); }
        .btn-edit:active { transform: scale(0.96); }

        footer { text-align: center; padding: 30px; color: #475569; font-size: 0.85rem; font-weight: 700; margin-top: auto; }

        @media (max-width: 450px) {
            .target-card { max-width: 100%; border-radius: 20px; }
            .diff-number { font-size: 2.8rem; }
            .nav-logo span { display: none; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-logo"><i class="fas fa-bullseye"></i> <span>منصة التميز</span></div>
        <a href="index.html" class="nav-link">
            <i class="fas fa-home"></i> الرئيسية
        </a>
    </nav>

    <div class="main-wrapper">
        <div class="target-card">
            <div class="main-icon" id="mainIcon"><i class="fas fa-rocket"></i></div>
            <h1>تحليل هدفك السنوي</h1>
            
            <div class="stats-grid">
                <div class="stat-box">
                    <i class="fas fa-flag-checkered"></i>
                    <label>هدفي المسجل</label>
                    <span id="goalVal">0.00</span>
                </div>
                <div class="stat-box">
                    <i class="fas fa-user-graduate"></i>
                    <label>معدلي الحالي</label>
                    <span id="currentVal">0.00</span>
                </div>
            </div>

            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <div class="result-zone">
                <label id="msgLabel">المسافة المتبقية للحلم:</label>
                <span class="diff-number" id="diffVal">0.00</span>
                <p class="motivate-txt" id="motivateMsg">استمر في التقدم، القمة بانتظارك!</p>
            </div>

            <button class="btn-edit" onclick="resetGoal()">
                <i class="fas fa-edit"></i> تعديل هدفك السنوي
            </button>
        </div>
    </div>

    <footer>جميع الحقوق محفوظة منصة التميز &copy; 2026</footer>

    <script>
        window.onload = function() {
            const savedGoal = localStorage.getItem('user_target_grade');
            const goal = savedGoal ? parseFloat(savedGoal) : 0;
            const savedAverage = localStorage.getItem('total_average');
            const current = savedAverage ? parseFloat(savedAverage) : 0;

            document.getElementById('goalVal').innerText = goal.toFixed(2);
            document.getElementById('currentVal').innerText = current.toFixed(2);

            const diffVal = document.getElementById('diffVal');
            const msgLabel = document.getElementById('msgLabel');
            const motivateMsg = document.getElementById('motivateMsg');
            const mainIcon = document.getElementById('mainIcon');
            const progressBar = document.getElementById('progressBar');

            if (goal > 0) {
                let percent = (current / goal) * 100;
                if (percent > 100) percent = 100;
                setTimeout(() => {
                    progressBar.style.width = percent + "%";
                }, 300);
            }

            if (goal <= 0) {
                diffVal.innerText = "??";
                motivateMsg.innerText = "يرجى تحديد هدف أولاً";
                motivateMsg.style.color = "#94a3b8";
            } 
            else if (current >= goal && current > 0) {
                mainIcon.innerHTML = '<i class="fas fa-trophy" style="color: #f1c40f;"></i>';
                msgLabel.innerText = "مبروك! لقد فعلتها:";
                diffVal.innerText = "بطل";
                diffVal.style.color = "var(--success)";
                motivateMsg.innerText = "لقد حققت هدفك وتجاوزته!";
                motivateMsg.style.color = "var(--success)";
            } 
            else {
                let diff = goal - current;
                diffVal.innerText = diff.toFixed(2);
                if (diff < 1) {
                    motivateMsg.innerText = "أنت قريب جداً! قليل من الجهد فقط.";
                    mainIcon.innerHTML = '<i class="fas fa-fire" style="color: #e67e22;"></i>';
                }
            }
        }

        function resetGoal() {
            if(confirm("هل أنت متأكد من رغبتك في تغيير هدفك؟")) {
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موسوعة العلوم | الترحيب</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .welcome-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 50px 30px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 600px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        h1 { color: #00d2ff; font-size: 2.5rem; margin-bottom: 20px; }
        
        p { font-size: 1.2rem; line-height: 1.8; color: #ccc; margin-bottom: 40px; }

        .enter-btn {
            background: linear-gradient(45deg, #00d2ff, #3a7bd5);
            color: white;
            text-decoration: none;
            padding: 15px 50px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.3rem;
            transition: 0.3s;
            display: inline-block;
            box-shadow: 0 5px 20px rgba(0, 210, 255, 0.4);
        }

        .enter-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 30px rgba(0, 210, 255, 0.6);
        }
    </style>
</head>
<body>

    <div class="welcome-card">
        <h1>مرحباً بكم في موسوعة العلوم 🧬</h1>
        <p>
            هذا الموقع مخصص حصرياً لتلاميذ **الجذع المشترك العلمي**. 
            نقدم لكم هنا تجميعة لأهم **الفروض المحروسة** التي تتكرر باستمرار، 
            لمساعدتكم على التحضير الجيد والتميز في مساركم الدراسي.
        </p>
        <a href="subjects.html" class="enter-btn">اضغط للدخول</a>
    </div>

</body>
</html>

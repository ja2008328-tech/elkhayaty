<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Monument Valley - VS Code Version</title>
    <style>
        body { margin: 0; overflow: hidden; background: #fce4ec; }
        #ui { position: absolute; top: 20px; left: 20px; color: white; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px; font-family: sans-serif; }
    </style>
</head>
<body>
    <div id="ui">استخدم WASD للحركة - تشغيل عبر VS Code</div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        // ملاحظة: المسار يبدأ بـ ./ ليعرف المتصفح أنه ملف محلي
        import { createPlayer } from './js/player.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffe4e1);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 20000);
        camera.position.set(1000, 1000, 1000);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(500, 1000, 500);
        scene.add(light, new THREE.AmbientLight(0xffffff, 0.5));

        // إنشاء الأرضية بسيطة
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(5000, 5000), new THREE.MeshStandardMaterial({color: 0x95cc95}));
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        const player = createPlayer(scene, 1000);

        function animate() {
            requestAnimationFrame(animate);
            camera.lookAt(player.position);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>

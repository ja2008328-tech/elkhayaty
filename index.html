<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مشروعي الأول</title>
    <link rel="stylesheet" href="https://pyscript.net/latest/pyscript.css" />
    <script defer src="https://pyscript.net/latest/pyscript.js"></script>
</head>
<body style="background: #f0f0f0; text-align: center; padding-top: 50px;">
    
    <div style="background: white; display: inline-block; padding: 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
        <h2>🎯 تجربة بايثون</h2>
        <input type="number" id="num" placeholder="اكتب رقماً هنا">
        <button id="btn" py-click="test_func">اضغط للتجربة</button>
        <p id="out"></p>

        <py-script>
def test_func(*args):
    # الحصول على الرقم من المدخل
    val = Element("num").element.value
    # إظهار رسالة في الموقع
    Element("out").write(f"لقد كتبت الرقم: {val}")
        </py-script>
    </div>

</body>
</html>

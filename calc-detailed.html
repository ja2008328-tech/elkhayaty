<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <title>محاكي تنقيط مسار | الجذع المشترك العلمي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --primary: #2ecc71; 
            --bg: #0f172a; 
            --card: rgba(30, 41, 59, 0.7); 
            --text: #f8fafc; 
            --danger: #ff4757;
            --warning: #ffa502;
            color-scheme: dark;
        }

        @keyframes fadeInPage {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .page-transition { animation: fadeInPage 0.8s ease-out forwards; }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body { 
            background-color: var(--bg); 
            background-image: radial-gradient(circle at top right, rgba(46, 204, 113, 0.03), transparent);
            color: var(--text); 
            padding-bottom: env(safe-area-inset-bottom);
            line-height: 1.4;
            overflow-x: hidden;
            padding-top: env(safe-area-inset-top);
            min-height: 100vh;
        }

        .container { width: 100%; padding: 0 8px; margin: 0 auto; max-width: 800px; }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 12px 15px;
            border-radius: 0 0 15px 15px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--primary);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .btn-back {
            text-decoration: none;
            color: var(--text);
            padding: 6px 14px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(255,255,255,0.03);
        }

        .btn-back:hover { background: var(--primary); color: #0f172a; border-color: var(--primary); transform: translateX(-3px); }
        
        .nav-title { color: var(--primary); font-weight: 900; font-size: 0.9rem; letter-spacing: 0.5px; }

        .pro-header { text-align: center; margin-bottom: 20px; }
        .pro-header h1 {
            font-size: clamp(1.5rem, 7vw, 2.2rem); 
            font-weight: 900;
            background: linear-gradient(135deg, #fff 30%, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            animation: slideDown 0.8s ease-out;
            letter-spacing: -1px;
        }

        .pro-hint {
            padding: 10px 15px;
            background: rgba(46, 204, 113, 0.08);
            border-right: 4px solid var(--primary);
            color: #94a3b8;
            font-size: 0.75rem;
            border-radius: 6px;
            text-align: right;
            display: inline-block;
        }

        .table-container { 
            width: 100%;
            overflow-x: hidden;
            background: var(--card); 
            backdrop-filter: blur(10px);
            border-radius: 18px; 
            padding: 10px; 
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        
        th { 
            background: rgba(46, 204, 113, 0.12); 
            color: var(--primary); 
            padding: 10px 2px; 
            font-size: 0.7rem; 
            font-weight: 900;
        }

        td { padding: 6px 1px; border-bottom: 1px solid rgba(255,255,255,0.05); text-align: center; }

        .subject-name-td {
            text-align: right; 
            font-weight: 700; 
            color: #e2e8f0; 
            font-size: 0.75rem;
            width: 85px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 5px;
        }

        input { 
            width: 35px; 
            height: 32px;
            padding: 4px; 
            border-radius: 8px; 
            border: 1px solid rgba(255,255,255,0.15); 
            background: rgba(15, 23, 42, 0.6); 
            color: white; 
            text-align: center; 
            font-size: 0.8rem;
            font-weight: 700;
            outline: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(46, 204, 113, 0.3);
            transform: scale(1.15);
            background: var(--bg);
            z-index: 10;
        }

        input:disabled { opacity: 0.02; cursor: not-allowed; border: none; }
        
        .sub-avg-cell { 
            font-weight: 900; 
            color: var(--primary); 
            background: rgba(46, 204, 113, 0.05); 
            font-size: 0.85rem;
            border-radius: 6px;
            width: 45px;
        }

        /* --- الفوتر مع الأنيميشن الجديد --- */
        .footer-avg { 
            margin: 25px 0; 
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(15px);
            padding: 18px; 
            border-radius: 22px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            border: 1px solid rgba(46, 204, 113, 0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .grand-total-label { font-weight: 800; font-size: 0.95rem; color: #94a3b8; }
        #grandTotal { font-size: 2.4rem; font-weight: 900; transition: color 0.5s ease; }

        .status-low { color: var(--danger) !important; }
        .status-mid { color: var(--warning) !important; }
        .status-high { color: var(--primary) !important; text-shadow: 0 0 15px rgba(46, 204, 113, 0.4); }

        .footer-btns { display: flex; gap: 8px; }

        .btn-footer { 
            background: #1e293b; 
            color: white; 
            padding: 10px 15px; 
            border-radius: 12px; 
            font-weight: 900; 
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); /* أنيميشن سلس */
        }

        /* أنيميشن التحويم والضغط المستوحى من الكود الأخير */
        .btn-footer:hover { transform: translateY(-4px); background: #334155; }
        .btn-footer:active { transform: scale(0.9); }

        .btn-clear { background: rgba(231, 76, 60, 0.1); color: #e74c3c; border-color: rgba(231, 76, 60, 0.2); }
        .btn-clear:hover { background: #e74c3c; color: white; }

        @media (max-width: 400px) {
            th span.full { display: none; }
            th span.short { display: inline; }
            .subject-name-td { width: 70px; font-size: 0.65rem !important; }
            input { width: 32px; font-size: 0.75rem; }
        }
        @media (min-width: 401px) {
            th span.short { display: none; }
        }
    </style>
</head>
<body class="page-transition"> 
<div class="container">
    <nav class="top-nav">
        <a href="selection.html" class="btn-back"><i class="fas fa-arrow-right"></i> العودة</a>
        <div class="nav-title">محاكي تنقيط مسار</div>
    </nav>
    
    <header class="pro-header">
        <h1>محاكي تنقيط مسار</h1>
        <div class="pro-hint">
            <i class="fas fa-magic"></i> أدخل النقاط واضغط <strong>Enter</strong> للتنقل.
        </div>
    </header>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="text-align: right; width: 85px;">المادة</th>
                    <th>ف1</th>
                    <th>ف2</th>
                    <th>ف3</th>
                    <th>ف4</th>
                    <th><span class="full">أنشطة</span><span class="short">أنش</span></th>
                    <th><span class="full">معامل</span><span class="short">مع</span></th>
                    <th class="sub-avg-cell">معدل</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div class="footer-avg">
        <div>
            <span class="grand-total-label">المعدل العام:</span>
            <div id="grandTotal">0.00</div>
        </div>
        <div class="footer-btns">
            <button class="btn-footer btn-clear" onclick="clearAllData()">
                <i class="fas fa-trash-alt"></i>
            </button>
            <button class="btn-footer" onclick="saveVisualFeedback(this)">
                <i class="fas fa-check-circle"></i> <span>حفظ</span>
            </button>
        </div>
    </div>
</div>

<script>
    const massarConfig = [
        { name: "اللغة الفرنسية", coef: 3, exams: 4, hasAct: true },
        { name: "الرياضيات", coef: 4, exams: 3, hasAct: false },
        { name: "الفيزياء والكيمياء", coef: 4, exams: 3, hasAct: true },
        { name: "المعلوميات", coef: 2, exams: 4, hasAct: true },
        { name: "اللغة العربية", coef: 2, exams: 2, hasAct: true },
        { name: "اللغة الإنجليزية", coef: 3, exams: 2, hasAct: true },
        { name: "علوم الحياة والأرض", coef: 4, exams: 2, hasAct: true },
        { name: "الاجتماعيات", coef: 2, exams: 2, hasAct: true },
        { name: "التربية الإسلامية", coef: 2, exams: 2, hasAct: true },
        { name: "الفلسفة", coef: 2, exams: 2, hasAct: true },
        { name: "التربية البدنية", coef: 2, exams: 3, hasAct: true },
        { name: "المواظبة والسلوك", coef: 1, exams: 0, hasAct: true }
    ];

    function initTable() {
        const body = document.getElementById('tableBody');
        massarConfig.forEach((sub, i) => {
            body.innerHTML += `
                <tr>
                    <td class="subject-name-td">${sub.name}</td>
                    <td><input type="text" inputmode="decimal" id="f1-${i}" oninput="validateAndCalc(${i}, this)" onkeydown="handleEnter(event, ${i}, 1)" ${sub.exams < 1 ? 'disabled' : ''} placeholder="-"></td>
                    <td><input type="text" inputmode="decimal" id="f2-${i}" oninput="validateAndCalc(${i}, this)" onkeydown="handleEnter(event, ${i}, 2)" ${sub.exams < 2 ? 'disabled' : ''} placeholder="-"></td>
                    <td><input type="text" inputmode="decimal" id="f3-${i}" oninput="validateAndCalc(${i}, this)" onkeydown="handleEnter(event, ${i}, 3)" ${sub.exams < 3 ? 'disabled' : ''} placeholder="-"></td>
                    <td><input type="text" inputmode="decimal" id="f4-${i}" oninput="validateAndCalc(${i}, this)" onkeydown="handleEnter(event, ${i}, 4)" ${sub.exams < 4 ? 'disabled' : ''} placeholder="-"></td>
                    <td><input type="text" inputmode="decimal" id="act-${i}" oninput="validateAndCalc(${i}, this)" onkeydown="handleEnter(event, ${i}, 5)" ${!sub.hasAct ? 'disabled' : ''} placeholder="-"></td>
                    <td><input type="text" inputmode="decimal" id="coef-${i}" value="${sub.coef}" oninput="validateAndCalc(${i}, this); calcAll()" onkeydown="handleEnter(event, ${i}, 6)"></td>
                    <td class="sub-avg-cell" id="res-${i}">0.00</td>
                </tr>
            `;
        });
        loadSavedData();
    }

    function handleEnter(e, i, fieldNum) {
        if (e.key === "Enter") {
            e.preventDefault();
            let next;
            if (fieldNum < 6) {
                for(let j=fieldNum+1; j<=6; j++) {
                    let id = j === 5 ? `act-${i}` : (j === 6 ? `coef-${i}` : `f${j}-${i}`);
                    let el = document.getElementById(id);
                    if(el && !el.disabled) { next = el; break; }
                }
            }
            if (!next && i < massarConfig.length - 1) {
                next = document.getElementById(`f1-${i+1}`);
            }
            if (next) next.focus();
        }
    }

    function validateAndCalc(i, input) {
        input.value = input.value.replace(/[^0-9.]/g, '');
        calcRow(i);
    }

    function calcRow(i) {
        const sub = massarConfig[i];
        let sumExams = 0, countExams = 0;
        for(let j=1; j<=4; j++) {
            let val = parseFloat(document.getElementById(`f${j}-${i}`).value);
            if(!isNaN(val)) { sumExams += val; countExams++; }
        }
        let act = parseFloat(document.getElementById(`act-${i}`).value) || 0;
        let examAvg = countExams > 0 ? (sumExams / countExams) : 0;
        let rowAvg = (sub.name === "الرياضيات") ? examAvg : 
                     (sub.name === "المواظبة والسلوك") ? act : 
                     (examAvg * 0.75) + (act * 0.25);
        document.getElementById(`res-${i}`).innerText = rowAvg.toFixed(2);
        saveCurrentProgress();
        calcAll();
    }

    function calcAll() {
        let totalP = 0, totalC = 0;
        massarConfig.forEach((_, i) => {
            let avg = parseFloat(document.getElementById(`res-${i}`).innerText) || 0;
            let c = parseFloat(document.getElementById(`coef-${i}`).value) || 0;
            totalP += (avg * c);
            totalC += c;
        });
        const finalAvg = totalC > 0 ? (totalP / totalC).toFixed(2) : "0.00";
        const display = document.getElementById('grandTotal');
        display.innerText = finalAvg;
        display.classList.remove('status-low', 'status-mid', 'status-high');
        let num = parseFloat(finalAvg);
        if (num > 0 && num < 10) display.classList.add('status-low');
        else if (num >= 10 && num < 15) display.classList.add('status-mid');
        else if (num >= 15) display.classList.add('status-high');
        localStorage.setItem('total_average', finalAvg);
    }

    // الأنيميشن المطور لزر الحفظ
    function saveVisualFeedback(btn) {
        const icon = btn.querySelector('i');
        const originalClass = icon.className;
        icon.className = "fas fa-spinner fa-spin"; // أيقونة تحميل
        
        setTimeout(() => {
            icon.className = "fas fa-check-double"; // أيقونة تأكيد
            btn.style.borderColor = "var(--primary)";
            setTimeout(() => {
                icon.className = originalClass;
                btn.style.borderColor = "rgba(255,255,255,0.1)";
            }, 1500);
        }, 500);
    }

    function saveCurrentProgress() {
        const data = {};
        document.querySelectorAll('input').forEach(input => {
            if(input.id && input.value !== "") data[input.id] = input.value;
        });
        localStorage.setItem('massar_detailed_v5', JSON.stringify(data));
    }

    function loadSavedData() {
        const saved = localStorage.getItem('massar_detailed_v5');
        if (saved) {
            const data = JSON.parse(saved);
            for (const id in data) {
                const el = document.getElementById(id);
                if (el) el.value = data[id];
            }
            massarConfig.forEach((_, i) => calcRow(i));
        }
    }

    function clearAllData() {
        if (confirm("هل تريد مسح جميع البيانات؟")) {
            localStorage.removeItem('massar_detailed_v5');
            location.reload();
        }
    }

    window.onload = initTable;
</script>
</body>
</html>

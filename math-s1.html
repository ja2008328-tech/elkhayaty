<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نماذج فروض الرياضيات</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f172a;
            color: white;
            margin: 0;
            padding: 20px;
        }

        .container { max-width: 1000px; margin: 30px auto; }
        
        h1 { text-align: center; color: #3498db; margin-bottom: 40px; }

        /* تنسيق عنوان الفرض الصغير */
        .exam-section-title {
            font-size: 1.1rem;
            color: #3498db;
            background: rgba(52, 152, 219, 0.1);
            display: inline-block;
            padding: 5px 20px;
            border-radius: 20px;
            margin-bottom: 15px;
            border: 1px solid #3498db;
        }

        /* شبكة النماذج */
        .models-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            margin-bottom: 40px;
        }

        /* تصميم زر النموذج الصغير */
        .model-card {
            background: #1e293b;
            color: white;
            text-decoration: none;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            font-size: 0.9rem;
            border: 1px solid rgba(255,255,255,0.05);
            transition: 0.3s;
        }

        .model-card:hover {
            background: #3498db;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
        }

        .model-card i { display: block; font-size: 1.5rem; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>📐 نماذج فروض الرياضيات - الدورة 1</h1>

        <div class="exam-section-title">الفرض المحروس الأول</div>
        <div class="models-grid">
            <a href="files/math_s1_c1_m1.pdf" class="model-card">نموذج 1</a>
            <a href="files/math_s1_c1_m2.pdf" class="model-card">نموذج 2</a>
            <a href="files/math_s1_c1_m3.pdf" class="model-card">نموذج 3</a>
            <a href="files/math_s1_c1_m4.pdf" class="model-card">نموذج 4</a>
            <a href="files/math_s1_c1_m5.pdf" class="model-card">نموذج 5</a>
        </div>

        <div class="exam-section-title">الفرض المحروس الثاني</div>
        <div class="models-grid">
            <a href="files/math_s1_c2_m1.pdf" class="model-card">نموذج 1</a>
            <a href="files/math_s1_c2_m2.pdf" class="model-card">نموذج 2</a>
            <a href="files/math_s1_c2_m3.pdf" class="model-card">نموذج 3</a>
        </div>

        <div class="exam-section-title">الفرض المحروس الثالث</div>
        <div class="models-grid">
            <a href="files/math_s1_c3_m1.pdf" class="model-card">نموذج 1</a>
            <a href="files/math_s1_c3_m2.pdf" class="model-card">نموذج 2</a>
        </div>

        <div style="text-align: center; margin-top: 50px;">
            <a href="subjects.html" style="color: #888; text-decoration: none;">← العودة للقائمة السابقة</a>
        </div>
    </div>

</body>
</html>
